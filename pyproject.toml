[project]
name = "tft-data-miner"
version = "0.1.0"
description = "Minerador de dados do Teamfight Tactics via Riot API"
readme = "README.md"
requires-python = ">=3.12"  # Define a versão mínima do Python
dependencies = [
    "requests",
    "python-dotenv",
    "pandas",
    "openpyxl",
    "pydantic", # Adicionei aqui pois o Barão citou no Mypy
    "dotenv>=0.9.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 120
fix = true
unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120

[tool.ruff.lint]
ignore = [
    "D",      # pydocstyle
    "DOC",    # pydoclint
    "E741",   # Ambiguous variable name (e.g., 'l', 'O', 'I' that look like numbers),
    "EM",     # lint.flake8-errmsg
    "FIX002", # Line contains TODO, consider resolving the issue
    "T201",   # print found
    "TD",     # flake8-todos
    "TRY003", # Avoid specifying long messages outside the exception class
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/tests/**" = ["S101"]
